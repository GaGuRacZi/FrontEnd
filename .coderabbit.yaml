# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"
early_access: false

# CodeRabbit tone_instructions 최대 250자
tone_instructions: "Expo SDK 54, React Native, Expo Router, TypeScript strict 관점으로 리뷰해주세요. 런타임 오류, 잘못된 라우팅, 상태 처리 누락, Android 호환성, 성능, 접근성, 보안 문제를 우선 확인하고 스타일 취향보다 실제 사용자 문제와 팀 컨벤션 위반에 집중해주세요."

reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

  path_filters:
    - "!node_modules/**"
    - "!.expo/**"
    - "!dist/**"
    - "!coverage/**"
    - "!assets/images/**"
    - "!package-lock.json"
    - "!**/*.md"

  path_instructions:
    - path: "app/**/*.{ts,tsx}"
      instructions: |
        Expo Router의 파일 기반 라우팅 영역입니다.
        - app/은 라우팅과 레이아웃 설정만 담당하고 긴 화면 UI나 비즈니스 로직은 src/features로 분리했는지 확인해주세요.
        - 각 라우트가 default export를 제공하고 경로명, route group, _layout.tsx의 Stack/Tabs 구성이 올바른지 검토해주세요.
        - 인증 여부에 따른 리디렉션과 뒤로가기 흐름에서 무한 이동이나 잘못된 초기 화면이 없는지 확인해주세요.

    - path: "src/components/**/*.{ts,tsx}"
      instructions: |
        여러 기능에서 사용하는 공통 UI 컴포넌트입니다.
        - Props 타입이 명확하고 any를 사용하지 않는지 확인해주세요.
        - 특정 기능의 비즈니스 로직이나 API 요청이 포함되지 않았는지 검토해주세요.
        - 색상, 간격, 폰트가 constants의 디자인 토큰을 사용하는지 확인해주세요.
        - Pressable 등 상호작용 요소에 접근성 라벨, 충분한 터치 영역, disabled/pressed 상태가 있는지 검토해주세요.
        - 공통 컴포넌트 변경이 기존 사용 화면을 깨뜨릴 가능성이 없는지 확인해주세요.

    - path: "src/features/**/*.{ts,tsx}"
      instructions: |
        기능 단위 화면, 컴포넌트, 훅, 서비스가 위치하는 영역입니다.
        - auth, home, schedule, dashboard, health-summary, community, chat, mypage, pet의 책임이 섞이지 않았는지 확인해주세요.
        - 로딩, 오류, 빈 데이터, 성공 상태와 중복 제출 방지가 적절히 처리되는지 검토해주세요.
        - 화면 전환 후 비동기 작업이나 구독이 안전하게 정리되는지 확인해주세요.
        - 서버 데이터와 화면 전용 상태가 불필요하게 중복되거나 서로 어긋나지 않는지 검토해주세요.

    - path: "src/{services,features/**/services}/**/*.{ts,tsx}"
      instructions: |
        API 클라이언트와 기능별 서버 요청 코드입니다.
        - API 요청이 화면 컴포넌트에서 분리되어 있는지 확인해주세요.
        - 요청/응답 타입, 오류 처리, HTTP 상태 처리와 취소 또는 재시도 흐름이 적절한지 검토해주세요.
        - JWT 저장 및 전송 과정에서 토큰, 개인정보, API 키를 로그에 출력하거나 코드에 하드코딩하지 않았는지 확인해주세요.
        - 인증 만료와 네트워크 실패가 사용자에게 안전하게 처리되는지 검토해주세요.

    - path: "src/{hooks,utils,types}/**/*.{ts,tsx}"
      instructions: |
        공통 훅, 유틸리티와 타입 영역입니다.
        - any, 불필요한 타입 단언, null/undefined 처리 누락이 없는지 확인해주세요.
        - 훅의 의존성 배열과 cleanup이 올바르고 렌더링마다 불필요한 작업을 만들지 않는지 검토해주세요.
        - 유틸리티가 React 컴포넌트나 특정 화면 상태에 과도하게 의존하지 않는지 확인해주세요.

    - path: "src/constants/**/*.{ts,tsx}"
      instructions: |
        색상, 레이아웃, 타이포그래피 디자인 토큰 영역입니다.
        - 동일한 의미의 토큰이 중복되지 않는지 확인해주세요.
        - 토큰 이름이 역할을 명확히 나타내고 기존 화면과 호환되는지 검토해주세요.

    - path: "**/*.{ts,tsx}"
      instructions: |
        React Native와 TypeScript 공통 검토 사항입니다.
        - 화면 너비를 402처럼 고정하거나 웹 전용 DOM API를 사용하지 않았는지 확인해주세요.
        - Safe Area, 키보드, ScrollView/FlatList, Android 뒤로가기와 작은 화면에서의 레이아웃을 고려했는지 검토해주세요.
        - 리스트 key, 불필요한 재렌더링, 무거운 계산, 이미지 크기로 인한 성능 문제가 없는지 확인해주세요.
        - 사용자 입력 검증, 중복 터치, 권한 거부, 네트워크 지연 상황을 안전하게 처리하는지 검토해주세요.

    - path: "{package.json,app.json,tsconfig.json}"
      instructions: |
        Expo 및 TypeScript 프로젝트 설정입니다.
        - Expo SDK와 React Native 패키지 버전의 호환성을 확인해주세요.
        - 불필요한 패키지, 누락된 설정, 잘못된 스크립트가 없는지 검토해주세요.
        - API 키, 토큰, 비밀번호 등 민감한 값이 포함되지 않았는지 확인해주세요.

chat:
  auto_reply: true
  allow_non_org_members: false
